<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise for Nusa!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-pink: #ff4d6d; --soft-pink: #fff0f3; }
        body, html { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background-color: #fff5f6; overflow-x: hidden; width: 100%; }
        .hidden { display: none !important; }

        /* SECTION 1: GAME */
        #game-section { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; }
        #game-section h1 { font-size: 1.8rem; margin: 20px 0; color: #4a4a4a; }
        #game-section img { width: 80%; max-width: 250px; height: auto; }
        .btn-group { margin-top: 20px; position: relative; width: 100%; height: 120px; display: flex; justify-content: center; align-items: center; }
        button { font-size: 1.1rem; padding: 12px 30px; border: none; border-radius: 50px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        #yes-btn { background-color: var(--primary-pink); color: white; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3); }
        #no-btn { background-color: #616161; color: white; position: absolute; z-index: 1000; left: 55%; }

        /* SECTION 2: GALLERY */
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #fff 0%, #ffeef2 100%); text-align: center; padding: 20px; box-sizing: border-box; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; padding: 40px 20px; margin: 0 auto; box-sizing: border-box; }
        .photo-card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .photo-card img { width: 100%; height: auto; max-height: 400px; object-fit: cover; border-radius: 8px; }

        /* SECTION 3: THE TREE (Restored to original Laptop quality) */
        #tree-section { background: #0a0a0a; height: 100vh; width: 100vw; position: relative; overflow: hidden; }
        #quote-sidebar { position: absolute; top: 40px; left: 30px; bottom: 40px; width: 80%; max-width: 450px; display: flex; flex-direction: column; justify-content: flex-start; pointer-events: none; z-index: 10; mask-image: linear-gradient(to bottom, black 80%, transparent 100%); }
        .quote-entry { color: rgba(255, 255, 255, 0.8); font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; text-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .letter { display: inline-block; opacity: 0; filter: blur(10px); transform: translateX(-10px); transition: opacity 2.5s, filter 2.5s, transform 2s; }
        .letter.visible { opacity: 0.7; filter: blur(0px); transform: translateX(0); }
        canvas { display: block; }

        .heart-float { position: fixed; color: var(--primary-pink); font-size: 20px; pointer-events: none; animation: floatUp 5s linear forwards; z-index: 1000; }
        @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="your-song.mp3" type="audio/mpeg">
    </audio>

    <section id="game-section">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif">
        <h1>Can I be your favorite notification?</h1>
        <div class="btn-group">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </section>

    <div id="gallery-wrapper" class="hidden">
        <div id="hearts-container"></div>
        <section class="hero">
            <div class="hero-content">
                <h1 id="typing-text" style="font-family: 'Dancing Script'; color: #ff4d6d; font-size: 3rem;"></h1>
                <p>Today is all about celebrating you!</p>
                <button onclick="document.getElementById('memories').scrollIntoView({behavior:'smooth'})" style="margin-top:20px; background:var(--primary-pink); color:white; padding:15px 30px; border-radius:30px; border:none;">View Memories ✨</button>
            </div>
        </section>

        <section id="memories">
            <h2 style="text-align:center; font-family: 'Dancing Script'; font-size: 2.5rem; color: #ff4d6d;">You're the real MVP!</h2>
            <div class="gallery">
                <div class="photo-card"><img src="nsua1.jpeg"><p>Favorite notification.</p></div>
                <div class="photo-card"><img src="nsua2.jpeg"><p>Reflection of beauty.</p></div>
                <div class="photo-card"><img src="nsua3.jpeg"><p>Partners in crime.</p></div>
                <div class="photo-card"><img src="nsua4.jpeg"><p>OG bestie forever.</p></div>
                <div class="photo-card"><img src="nsua5.jpeg"><p>The real MVP.</p></div>
                <div class="photo-card"><img src="nsua6.jpeg"><p>Brighter moments.</p></div>
            </div>
            <div style="text-align: center; padding: 60px;">
                <button onclick="showTreeSection()" style="background:var(--primary-pink); color:white; padding:15px 35px; border-radius:30px; border:none; font-weight:600;">One Last Surprise 🎁</button>
            </div>
        </section>
    </div>

    <section id="tree-section" class="hidden">
        <div id="quote-sidebar"></div>
        <canvas id="c"></canvas>
    </section>

    <script>
        const audio = document.getElementById('bg-music');
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const c = document.getElementById("c");
        const ctx = c.getContext("2d");

        window.addEventListener('click', () => { audio.play().catch(e => {}); }, { once: true });

        function moveButton() {
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            noBtn.style.position = 'fixed';
            noBtn.style.left = Math.max(10, Math.random() * maxX) + 'px';
            noBtn.style.top = Math.max(10, Math.random() * maxY) + 'px';
        }
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveButton(); });

        yesBtn.addEventListener('click', () => {
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('gallery-wrapper').classList.remove('hidden');
            typeEffect();
            setInterval(createHeart, 400);
        });

        const text = "Happy Birthday, Nusa!!! ";
        let index = 0;
        function typeEffect() {
            if (index < text.length) {
                document.getElementById("typing-text").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeEffect, 100);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-float');
            heart.innerHTML = '🧡';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        /* --- RESTORED TREE LOGIC --- */
        let branches = [];
        let petals = [];

        function showTreeSection() {
            document.getElementById('gallery-wrapper').classList.add('hidden');
            document.getElementById('tree-section').classList.remove('hidden');
            init(); start(); loop(); addPermanentQuote();
        }

        function init() { c.width = window.innerWidth; c.height = window.innerHeight; }

        class Branch {
            constructor(x, y, angle, length, width, depth) {
                this.x = x; this.y = y; this.angle = angle;
                this.length = length; this.width = width; this.depth = depth;
                this.curLength = 0; this.done = false;
            }
            draw() {
                if (this.curLength < this.length) {
                    this.curLength += 1.5; 
                } else if (!this.done) {
                    this.done = true;
                    this.split();
                }
                const nextX = this.x + Math.cos(this.angle) * this.curLength;
                const nextY = this.y + Math.sin(this.angle) * this.curLength;
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.6 - this.depth * 0.05})`;
                ctx.lineWidth = Math.max(1, this.width);
                ctx.lineCap = "round";
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(nextX, nextY); ctx.stroke();
                // Add petals (leaves) as it grows
                if (this.depth > 4 && Math.random() > 0.96) createPetal(nextX, nextY);
            }
            split() {
                if (this.depth >= 8) return;
                const nextX = this.x + Math.cos(this.angle) * this.length;
                const nextY = this.y + Math.sin(this.angle) * this.length;
                const num = Math.random() * 2 + 1;
                for (let i = 0; i < num; i++) {
                    const a = this.angle + (Math.random() - 0.5) * 1.1;
                    const l = this.length * (0.7 + Math.random() * 0.2);
                    branches.push(new Branch(nextX, nextY, a, l, this.width * 0.7, this.depth + 1));
                }
            }
        }

        function createPetal(x, y) {
            petals.push({ x, y, s: Math.random() * 2 + 2, vx: (Math.random() - 0.5) * 0.5, vy: Math.random() * 0.5 + 0.3 });
        }

        function drawHeartLeaf(x, y, s) {
            ctx.save();
            ctx.globalAlpha = 0.4; ctx.translate(x, y);
            ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-s, -s, -s * 2, s, 0, s * 2);
            ctx.bezierCurveTo(s * 2, s, s, -s, 0, 0);
            ctx.fillStyle = "#ff4d6d"; ctx.fill();
            ctx.restore();
        }

        function start() {
            branches = []; petals = [];
            branches.push(new Branch(c.width / 2, c.height, -Math.PI / 2, 100, 6, 0));
        }

        function loop() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, c.width, c.height);
            branches.forEach(b => b.draw());
            petals.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                drawHeartLeaf(p.x, p.y, p.s);
                if (p.y > c.height) petals.splice(i, 1);
            });
            requestAnimationFrame(loop);
        }

        const sidebar = document.getElementById("quote-sidebar");
        let quoteIndex = 0;
        const quotes = [
            "You don’t try to shine, you just do.",
            "Strong, real—no filters, just you.",
            "Different in ways I can’t ignore,",
            "and that’s exactly what I like you for."
        ];

        function addPermanentQuote() {
            if (quoteIndex >= quotes.length) return;
            const quoteWrapper = document.createElement("div");
            quoteWrapper.className = "quote-entry";
            const textStr = quotes[quoteIndex];
            textStr.split("").forEach((char, i) => {
                const span = document.createElement("span");
                span.textContent = char === " " ? "\u00A0" : char;
                span.className = "letter";
                quoteWrapper.appendChild(span);
                setTimeout(() => span.classList.add("visible"), i * 50);
            });
            sidebar.appendChild(quoteWrapper);
            quoteIndex++;
            setTimeout(addPermanentQuote, 4000); 
        }

        window.addEventListener('resize', () => { init(); start(); });
    </script>
</body>
</html>
